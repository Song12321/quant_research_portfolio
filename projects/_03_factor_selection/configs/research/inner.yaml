stage: inner
experiment_name: single_factor_inner
output_root: '../../workspace'
data_root: 'D:\lqs\quantity\parquet_data'
factor_definition_dir: '../factors/definitions'
direction_output_file: '../factors/inner_resolved_directions.yaml'

stock_pool_name: 'ZZ800'

experiments:
  - factor_name: 'three_low_one_high_value'
  - factor_name: 'three_low_one_high_lowprice'
  - factor_name: 'three_low_one_high_lowattn'
  - factor_name: 'three_low_one_high_improve'
  - factor_name: 'three_low_one_high'

research_window:
  start_date: '2024-01-01'
  end_date: '2025-07-10'

stock_pool_profiles:
  ZZ800:
    index_filter:
      enable: true
      index_code: '000906'
    filters:
      remove_st: true
      history_days: 252
      adapt_tradeable_matrix_by_suspend_resume: true
      min_liquidity_percentile: 0.10
      min_market_cap_percentile: 0.05

preprocessing:
  winsorization:
    method: 'mad'
    mad_threshold: 3.0
    by_industry:
      primary_level: 'l2_code'
      fallback_level: 'l1_code'
      min_samples: 10
  standardization:
    method: 'zscore'
  neutralization:
    enable: true
    factors: ['market_cap', 'industry'] # 中性化策略定义；程序严格按此列表回归
    by_industry:
      industry_level: 'l1_code'

evaluation:
  quantiles: 5
  forward_periods: [5, 10, 20 , 40]
  returns_calculator: ['o2o']
