factor_definition:

  # ----------------------------------------------------------------------------
  #  一、基础数据层 (Base Data) - action: null
  # ----------------------------------------------------------------------------
  - name: 'close'
    style_category: 'price'
    action: null
    time_alignment: 'no_shift'
    description: '后复权收盘价，所有价格、收益率、动量计算的基础。'
  - name: 'open'
    style_category: 'price'
    action: null
    time_alignment: 'no_shift'
    description: '后复权开盘价。'
  - name: 'high'
    style_category: 'price'
    action: null
    time_alignment: 'no_shift'
    description: '后复权最高价。'
  - name: 'low'
    style_category: 'price'
    action: null
    time_alignment: 'no_shift'
    description: '后复权最低价。'


  - name: 'vol_hfq'
    style_category: 'vol'
    action: null
    time_alignment: 'shift'
    description: ''

  - name: 'amount'
    style_category: 'liquidity'
    action: null
    time_alignment: 'shift'
    description: '每日成交额，用于计算流动性指标。'
  - name: 'total_mv'
    style_category: 'size'
    action: null
    time_alignment: 'shift'
    description: '每日总市值。'
  - name: 'circ_mv'
    style_category: 'size'
    action: null
    time_alignment: 'shift'
    description: '每日流通市值，在A股比总市值更能反映真实交易规模。'
  - name: 'turnover_rate'
    style_category: 'liquidity'
    action: null
    time_alignment: 'shift'
    description: '每日换手率。'

#  # --- 基础估值指标，其分母(B, E, S)源于财报，因此是事件驱动型 ---
